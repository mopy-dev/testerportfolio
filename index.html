<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mopy · Roblox QA Services</title>
<meta name="description" content="Experienced Roblox QA tester and lead. Open to work.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#070B26;--navy:#0B1445;--blue:#2447FF;--sky:#9DB4FF;--yellow:#FFD60A;--paper:#F4F6FF;--ok:#3DDC84;--bad:#FF5A5F;
--d:'Bricolage Grotesque',system-ui,sans-serif;--m:'DM Mono',ui-monospace,monospace;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px;height:auto}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--paper);font:400 17px/1.6 var(--d);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(7,11,38,.8);backdrop-filter:blur(12px);border-bottom:2px solid var(--blue)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:49;background:rgba(7,11,38,.8);backdrop-filter:blur(12px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.logo{font-weight:800;font-size:22px;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;background:var(--yellow);border-radius:50%;animation:pulse 1.6s infinite}
.links{display:flex;gap:6px;overflow-x:auto}
.links a{text-decoration:none;font-size:15px;padding:6px 12px;border-radius:99px;white-space:nowrap;transition:.2s}
.links a:hover{background:var(--yellow);color:var(--ink);transform:rotate(-3deg) scale(1.08)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,214,10,0);transform:scale(1.3)}0%{box-shadow:0 0 0 0 rgba(255,214,10,.7)}}
/* hero */
.hero{position:relative;padding:64px 0 80px;background:radial-gradient(900px 500px at 85% 20%,rgba(36,71,255,.55),transparent 70%),linear-gradient(var(--ink),var(--navy));overflow:hidden;min-height:calc(100vh - 58px)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(157,180,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(157,180,255,.09) 1px,transparent 1px);background-size:48px 48px;animation:grid 12s linear infinite;mask-image:linear-gradient(#000 40%,transparent)}
@keyframes grid{to{background-position:0 48px}}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.status{display:inline-flex;align-items:center;gap:10px;font:500 14px var(--m);background:rgba(61,220,132,.12);border:1px solid var(--ok);color:var(--ok);padding:6px 14px;border-radius:99px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
h1{font-size:clamp(44px,7.4vw,96px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin:22px 0}
h1 span{display:inline-block;opacity:0;transform:translateY(60px) rotate(6deg);animation:drop .7s cubic-bezier(.2,1.4,.4,1) forwards}
h1 .hl{background:var(--yellow);color:var(--ink);padding:0 .12em;border-radius:.12em;transform-origin:left;position:relative}
@keyframes drop{to{opacity:1;transform:none}}
.lead{max-width:520px;color:var(--sky);font-size:19px}
.cta{display:flex;gap:14px;margin:30px 0;flex-wrap:wrap}
.btn{font:700 17px var(--d);padding:14px 26px;border-radius:14px;text-decoration:none;border:2px solid var(--yellow);transition:.2s;display:inline-block;cursor:pointer}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:5px 5px 0 var(--blue)}
.btn.y:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--blue)}
.btn.g{color:var(--yellow)}.btn.g:hover{background:var(--yellow);color:var(--ink)}
.term{font:400 13.5px/1.7 var(--m);background:rgba(7,11,38,.85);border:2px solid var(--blue);border-radius:14px;padding:14px 16px;max-width:520px;height:176px;overflow:hidden;box-shadow:0 0 40px rgba(36,71,255,.4)}
.term b{color:var(--ok)}.term u{color:var(--bad);text-decoration:none;font-weight:500}.term em{color:var(--yellow);font-style:normal}
/* avatar */
.stage{position:relative;aspect-ratio:1;max-width:460px;margin:0 auto;width:100%}
.ring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--yellow);animation:spin 24s linear infinite}
.ring.b{inset:9%;border-color:var(--sky);animation-direction:reverse;animation-duration:16s}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{position:absolute;inset:14%;border-radius:50%;background:linear-gradient(160deg,var(--yellow),#ff9d00);overflow:hidden;box-shadow:0 0 0 8px var(--blue),0 30px 80px rgba(36,71,255,.6)}
.disc img{position:absolute;width:150%;left:-25%;top:-6%;transition:transform .15s;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--blue);box-shadow:0 0 18px 6px var(--blue);animation:scan 3s ease-in-out infinite;opacity:.8}
@keyframes scan{0%,100%{top:5%}50%{top:95%}}
.chip{position:absolute;font:500 13px var(--m);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:10px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--yellow);animation:float 5s ease-in-out infinite}
.chip:nth-of-type(3){top:6%;left:-4%}.chip:nth-of-type(4){top:44%;right:-6%;animation-delay:-1.5s;background:var(--yellow)}.chip:nth-of-type(5){bottom:6%;left:2%;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-14px) rotate(-3deg)}}
.bug{position:absolute;font-size:30px;cursor:crosshair;user-select:none;z-index:5;filter:drop-shadow(0 4px 6px #000);transition:transform .2s}
.bug.dead{transform:scale(2.4) rotate(180deg);opacity:0;transition:.4s}
.score{position:absolute;right:24px;bottom:18px;font:500 14px var(--m);color:var(--yellow);z-index:6}
/* marquee */
.mq{background:var(--yellow);color:var(--ink);border-block:3px solid var(--ink);overflow:hidden;transform:rotate(-1.2deg);margin:-14px -20px 0;position:relative;z-index:3}
.mq div{display:flex;width:max-content;animation:mq 28s linear infinite;font-weight:800;font-size:24px;padding:12px 0}
.mq:hover div{animation-play-state:paused}
.mq span{padding:0 22px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:110px 0}
h2{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.025em;line-height:1;margin-bottom:12px}
.sub{color:var(--sky);max-width:560px;margin-bottom:44px}
.light{background:var(--paper);color:var(--ink)}.light .sub{color:#4a56a0}
.blue{background:var(--blue)}.blue .sub{color:#dfe6ff}
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--ink);color:var(--paper);padding:22px;border-radius:18px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--blue);transition:.25s}
.stat:hover{transform:rotate(-2deg) translateY(-6px);background:var(--blue)}
.stat b{display:block;font-size:48px;font-weight:800;color:var(--yellow);line-height:1}
.stat span{font-size:14px;color:var(--sky)}
/* skills */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:18px 48px}
.bar .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar .t small{font:400 13px var(--m);color:var(--sky)}
.bar .tr{height:14px;background:rgba(157,180,255,.18);border-radius:99px;overflow:hidden}
.bar .f{height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(45deg,var(--yellow) 0 12px,#ffb800 12px 24px);transition:width 1.4s cubic-bezier(.2,.9,.2,1);background-size:34px 34px;animation:stripe 1s linear infinite}
@keyframes stripe{to{background-position:34px 0}}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}
.tools span{font:500 14px var(--m);border:2px solid var(--sky);padding:7px 14px;border-radius:99px;transition:.2s}
.tools span:hover{background:var(--yellow);color:var(--ink);border-color:var(--yellow);transform:translateY(-4px) rotate(2deg)}
/* reports */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.case{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--yellow);transition:.25s;display:flex;flex-direction:column;gap:12px;position:relative}
.case:hover{transform:translate(-4px,-6px) rotate(-1deg);box-shadow:14px 14px 0 var(--yellow)}
.case h3{font-size:25px;line-height:1.1}
.case p{font-size:15.5px;color:#3b4580;flex:1}
.badge{align-self:flex-start;font:500 12.5px var(--m);padding:4px 10px;border-radius:8px;background:var(--ok);color:var(--ink)}
.case .m{display:flex;gap:18px;font:400 13px var(--m);border-top:2px dashed #b9c4ff;padding-top:12px}
.case .m b{display:block;font:800 22px var(--d);color:var(--blue)}
/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{background:var(--ink);padding:24px;border-radius:18px;border:2px solid var(--yellow);transition:.3s;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--ink);font-weight:800;margin-bottom:14px}
.step:hover{transform:translateY(-10px);background:var(--navy)}
.step h3{font-size:21px}.step p{font-size:15px;color:var(--sky)}
/* contact */
.contact{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.contact h2{font-size:clamp(44px,8vw,104px)}
.clinks{display:grid;gap:12px}
.clinks a{display:flex;justify-content:space-between;background:var(--ink);padding:16px 20px;border-radius:14px;text-decoration:none;font-weight:700;border:2px solid var(--ink);transition:.2s}
.clinks a:hover{background:var(--yellow);color:var(--ink);transform:translateX(10px)}
.clinks small{font:400 13px var(--m);opacity:.7}
footer{text-align:center;padding:26px;font:400 13px var(--m);color:var(--sky);background:var(--ink)}
.rv{opacity:0;transform:translateY(34px);transition:.8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
#cur{position:fixed;width:34px;height:34px;border:2px solid var(--yellow);border-radius:50%;pointer-events:none;z-index:99;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .2s,height .2s;display:none}
#cur.big{width:60px;height:60px;background:rgba(255,214,10,.3)}
@media (pointer:fine){#cur{display:block}}
@media(max-width:900px){.hero .wrap,.about,.contact{grid-template-columns:1fr}.cases,.steps{grid-template-columns:1fr 1fr}.bars{grid-template-columns:1fr}.stage{max-width:340px}}
@media(max-width:560px){.cases,.steps{grid-template-columns:1fr}.links a:nth-child(n+4){display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}h1 span,.rv{opacity:1;transform:none}}
</style></head>

<script>
/* ============ EDIT ME: everything on the page comes from this object ============ */
const CONFIG={
 name:"Mopy",
 status:"Open to work",
 headline:["I break games","so players","don’t have to."], // words wrapped in * get the yellow highlight
 highlight:"don’t have to.",
 lead:"Roblox QA tester and lead. I find the bugs, exploits and leaks before your launch day does.",
 cta:"Hire me",
 chips:["Luau expierence","Lead QA","Exploit hunter"],
 marquee:["Regression testing","Exploit testing","Playtest feedback","Bug reproduction","Test plans","Release sign-off","Team leading","Roblox Studio"],
 about:{title:"Tester by habit, lead by choice.",text:"I’ve spent years in Roblox development, so I know how systems break and how to explain it clearly to scripters and designers. As a lead I build teams, train them and keep releases calm."},
 stats:[{n:2,s:"+",l:"years on Roblox"},{t:"∞",s:"+",l:"bugs reported"},{n:11,s:"+",l:"games tested"},{n:30,s:"+",l:"person teams led"}],

 tools:["Roblox Studio","Rojo","VS Code","Notion","Trello","Discord","GitHub","Playtests"],
 reports:[
  {t:"Main Gameplay",d:"Full pass on map design and player drop-outs before launch.",bugs:84,time:"3 wks",status:"PASS"},],
 process:[{t:"Plan",d:"Read the design and write test cases."},{t:"Break",d:"Run the build, push edge cases and try exploits."},{t:"Report",d:"Clear repro steps, clips and severity."},{t:"Verify",d:"Retest fixes and sign off the release."}],
 contact:{title:"Got a build to break?",text:"Open to QA tester and lead roles. Replies come fast.",
  links:[{n:"Email",v:"mohaimenpygerian@gmail.com",u:"mailto:mohaimenpygerian@gmail.com"},{n:"GitHub",v:"mopy-dev",u:"https://github.com/mopy-dev"},{n:"Portfolio",v:"mopy.netlify.app",u:"https://mopy.netlify.app"}]},
 log:["Spawn test: 40 players","Dash cooldown bypass","Respawn state reset","Shop purchase on lag","Round timer desync","Exploit: remote spam","Mobile UI overlap","Team swap mid-round"]
};
/* ================================================================================ */
const $=id=>document.getElementById(id),C=CONFIG,H=(e,h)=>e.innerHTML=h;
$('status').textContent=C.status;$('lead').textContent=C.lead;$('cta1').textContent=C.cta;
H($('nav'),[['about','About'],['skills','Skills'],['reports','Reports'],['process','Process'],['contact','Contact']].map(a=>`<a href="#${a[0]}">${a[1]}</a>`).join(''));
let i=0;H($('h1'),C.headline.map(l=>l.split(' ').map(w=>`<span style="animation-delay:${.15*i++}s">${w}</span>`).join(' ')).join('<br>').replace(/<span([^>]*)>(don’t|have|to\.)<\/span>/g,'<span class="hl"$1>$2</span>'));
['c1','c2','c3'].forEach((k,j)=>$(k).textContent=C.chips[j]);
H($('mq'),[...C.marquee,...C.marquee].map(t=>`<span>${t} ✦</span>`).join('')+[...C.marquee,...C.marquee].map(t=>`<span>${t} ✦</span>`).join(''));
$('aboutT').textContent=C.about.title;$('aboutP').textContent=C.about.text;
H($('stats'),C.stats.map(s=>`<div class="stat"><b data-n="${s.n}" data-s="${s.s}">0</b><span>${s.l}</span></div>`).join(''));
H($('bars'),C.skills.map(s=>`<div class="bar"><div class="t">${s.n}<small>${s.p}%</small></div><div class="tr"><div class="f" data-p="${s.p}"></div></div></div>`).join(''));
H($('tools'),C.tools.map(t=>`<span>${t}</span>`).join(''));
H($('cases'),C.reports.map((r,j)=>`<article class="case rv" style="transition-delay:${j*.12}s"><span class="badge">${r.status}</span><h3>${r.t}</h3><p>${r.d}</p><div class="m"><div><b>${r.bugs}</b>bugs found</div><div><b>${r.time}</b>duration</div></div></article>`).join(''));
H($('steps'),C.process.map(s=>`<div class="step"><h3>${s.t}</h3><p>${s.d}</p></div>`).join(''));
$('ctaT').textContent=C.contact.title;$('ctaP').textContent=C.contact.text;
H($('clinks'),C.contact.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.n}<small>${l.v}</small></a>`).join(''));
$('foot').textContent=`© ${new Date().getFullYear()} ${C.name}. Tested twice, shipped once.`;
/* live test log */
const T=$('term');let L=[];
function log(){const t=C.log[Math.floor(Math.random()*C.log.length)],f=Math.random()<.3;
 L.push(f?`<u>FAIL</u> ${t} <em>(bug filed)</em>`:`<b>PASS</b> ${t}`);if(L.length>6)L.shift();H(T,L.map(x=>'> '+x).join('<br>'));}
log();setInterval(log,1100);
/* reveal + counters + bars */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('in');
 el.querySelectorAll('[data-n]').forEach(b=>{const n=+b.dataset.n,t0=performance.now();(function f(t){const k=Math.min((t-t0)/1400,1);b.textContent=Math.round(n*(1-Math.pow(1-k,3)))+b.dataset.s;k<1&&requestAnimationFrame(f)})(t0)});
 el.querySelectorAll('.f').forEach(b=>b.style.width=b.dataset.p+'%');io.unobserve(el)}),{threshold:.2});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
/* bug squash game */
let sq=0;const hero=document.querySelector('.hero'),sc=$('score');const upd=()=>sc.textContent=`Bugs squashed: ${sq}`;upd();
function spawn(){if(document.hidden||hero.querySelectorAll('.bug').length>4)return;const b=document.createElement('div');b.className='bug';b.textContent='🐞';b.setAttribute('role','button');b.setAttribute('aria-label','Squash bug');
 const y=Math.random()*80+8,left=Math.random()<.5;b.style.top=y+'%';b.style.left=left?'-5%':'105%';hero.appendChild(b);
 const a=b.animate([{left:left?'-5%':'105%',top:y+'%'},{left:left?'105%':'-5%',top:(y+(Math.random()*30-15))+'%'}],{duration:7000+Math.random()*5000,easing:'ease-in-out'});
 a.onfinish=()=>b.remove();b.onclick=()=>{if(b.classList.contains('dead'))return;b.classList.add('dead');sq++;upd();setTimeout(()=>b.remove(),400)};}
setInterval(spawn,1800);spawn();
/* avatar tilt + cursor */
const st=$('stage'),av=$('av');st.addEventListener('mousemove',e=>{const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;av.style.transform=`translate(${x*24}px,${y*18}px) rotate(${x*6}deg)`});
st.addEventListener('mouseleave',()=>av.style.transform='');
const cur=$('cur');addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';cur.classList.toggle('big',!!e.target.closest('a,.bug,.stat,.case,.step'))});
</script></body></html>
